<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- 6-arm snowflake -->
  <g stroke="#29B5E8" stroke-width="2.8" stroke-linecap="round">
    <!-- vertical -->
    <line x1="20" y1="4" x2="20" y2="36"/>
    <!-- horizontal -->
    <line x1="4" y1="20" x2="36" y2="20"/>
    <!-- diagonal 1 -->
    <line x1="7.5" y1="7.5" x2="32.5" y2="32.5"/>
    <!-- diagonal 2 -->
    <line x1="32.5" y1="7.5" x2="7.5" y2="32.5"/>
    <!-- top branches -->
    <line x1="20" y1="4" x2="16" y2="9"/>
    <line x1="20" y1="4" x2="24" y2="9"/>
    <!-- bottom branches -->
    <line x1="20" y1="36" x2="16" y2="31"/>
    <line x1="20" y1="36" x2="24" y2="31"/>
    <!-- left branches -->
    <line x1="4" y1="20" x2="9" y2="16"/>
    <line x1="4" y1="20" x2="9" y2="24"/>
    <!-- right branches -->
    <line x1="36" y1="20" x2="31" y2="16"/>
    <line x1="36" y1="20" x2="31" y2="24"/>
  </g>
  <circle cx="20" cy="20" r="3" fill="#29B5E8"/>
</svg>
